[package]
name = "ferro_ta_wasm"
version = "1.5.0"
edition = "2021"
description = "WebAssembly bindings for ferro-ta technical analysis indicators"
license = "MIT"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
ferro_ta_core = { path = "../crates/ferro_ta_core", default-features = false }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = 3     # speed over size: ~3-10% faster, +14% gzipped .wasm
lto = true

[features]
# Opt-in: saveState/loadState on streaming classes. Pulls in serde_json
# (~+100 KB gzipped), so browser bundles stay lean by default.
snapshot = ["ferro_ta_core/serde"]
