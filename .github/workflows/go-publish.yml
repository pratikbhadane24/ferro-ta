name: Publish Go module and C libraries

# Go modules are published by pushing a git tag; there is no registry upload.
# The module lives in bindings/go, so its tags are `bindings/go/vX.Y.Z`.
#
# Prebuilt static archives make `go get` work without a Rust toolchain, but
# they are never committed to main: this workflow builds them per platform,
# commits them onto a DETACHED commit (main + bindings/go/lib/**) and tags that
# commit. The Go proxy serves the module zip from the tag.
#
# It runs on `release: published` (like wasm-publish.yml), so the GitHub
# Release created by release.yml already exists and also receives the C/C++
# assets (ferro_ta.h + static/shared libraries per platform).
#
# The `bindings/go/v*` tag does not match release.yml's `v*.*.*` filter, so
# pushing it does not start another release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rehearse, e.g. v1.3.1"
        required: true
      dry_run:
        description: "Build and assemble only; do not push the Go tag or upload assets"
        type: boolean
        default: true

permissions:
  contents: read

env:
  RUSTFLAGS: ""
  CARGO_TERM_COLOR: always
  # Smaller archives; symbols are not needed by consumers.
  CARGO_PROFILE_RELEASE_STRIP: debuginfo
  # Oldest macOS the archives target.
  MACOSX_DEPLOYMENT_TARGET: "11.0"
  MODULE: github.com/pratikbhadane24/ferro-ta/bindings/go

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: v
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-$INPUT_TAG}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Expected a tag like v1.3.1, got: $tag"; exit 1
          fi
          version="${tag#v}"
          go_version=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' bindings/go/version_gen.go)
          if [ "$go_version" != "$version" ]; then
            echo "bindings/go Version ($go_version) != release ($version); run bump_version.py"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # One job per platform. `go` entries produce the archive the Go module links;
  # every entry produces a C/C++ asset (header + static + shared library).
  # Native-arch runners also prove the archive links and passes the Go tests.
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.id }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # ubuntu-22.04: older glibc baseline so the archive links on more systems.
          - { id: linux_amd64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, go: true, test: true }
          - { id: linux_arm64, os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, go: true, test: true }
          - { id: darwin_arm64, os: macos-latest, target: aarch64-apple-darwin, go: true, test: true }
          - { id: darwin_amd64, os: macos-latest, target: x86_64-apple-darwin, go: true, test: false }
          # cgo on Windows drives MinGW gcc, so Go needs the -gnu archive...
          - { id: windows_amd64, os: windows-latest, target: x86_64-pc-windows-gnu, go: true, test: true }
          # ...while C/C++ users on Windows expect an MSVC .lib/.dll.
          - { id: windows_amd64_msvc, os: windows-latest, target: x86_64-pc-windows-msvc, go: false, test: false }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build -p ferro_ta_ffi --release --target ${{ matrix.target }}
      - name: Stage artifacts
        env:
          ID: ${{ matrix.id }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
          IS_GO: ${{ matrix.go }}
        run: |
          set -euo pipefail
          out="target/$TARGET/release"
          mkdir -p stage/go stage/c
          if [ "$IS_GO" = "true" ]; then
            mkdir -p "stage/go/$ID"
            cp "$out/libferro_ta_ffi.a" "stage/go/$ID/"
          fi
          pkg="ferro_ta-$VERSION-$ID"
          mkdir -p "stage/c/$pkg/include" "stage/c/$pkg/lib"
          cp crates/ferro_ta_ffi/include/ferro_ta.h "stage/c/$pkg/include/"
          cp LICENSE "stage/c/$pkg/"
          for f in libferro_ta_ffi.a libferro_ta_ffi.so libferro_ta_ffi.dylib \
                   ferro_ta_ffi.dll ferro_ta_ffi.lib ferro_ta_ffi.dll.lib libferro_ta_ffi.dll.a; do
            if [ -f "$out/$f" ]; then cp "$out/$f" "stage/c/$pkg/lib/"; fi
          done
          ls -la "stage/c/$pkg/lib"
          (cd stage/c && tar czf "$pkg.tar.gz" "$pkg" && rm -rf "$pkg")
      - uses: actions/setup-go@v6
        if: matrix.test
        with:
          go-version: stable
          cache-dependency-path: bindings/go/go.mod
      - name: Go tests against the staged archive
        if: matrix.test
        env:
          ID: ${{ matrix.id }}
        run: |
          mkdir -p "bindings/go/lib/$ID"
          cp "stage/go/$ID/libferro_ta_ffi.a" "bindings/go/lib/$ID/"
          cd bindings/go && go test -count=1 ./...
      - uses: actions/upload-artifact@v7
        with:
          name: ffi-${{ matrix.id }}
          path: stage
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Tag the Go module and attach C/C++ assets. The ONLY job with write access.
  # ---------------------------------------------------------------------------
  publish:
    name: Tag Go module and upload C assets
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      GO_TAG: bindings/go/${{ needs.version.outputs.tag }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          pattern: ffi-*
          path: artifacts
          merge-multiple: true
      - name: Assemble module with prebuilt archives
        run: |
          set -euo pipefail
          for dir in artifacts/go/*/; do
            id=$(basename "$dir")
            mkdir -p "bindings/go/lib/$id"
            cp "$dir/libferro_ta_ffi.a" "bindings/go/lib/$id/"
          done
          find bindings/go/lib -type f -exec ls -la {} \;
          # Go module zips are capped at 500 MB; stay far below it.
          size=$(du -sm bindings/go | cut -f1)
          echo "module size: ${size} MB"
          [ "$size" -lt 200 ]
      - name: Commit archives on a detached commit and tag it
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$GO_TAG" >/dev/null; then
            echo "$GO_TAG already exists; refusing to move a published Go version."; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --detach
          git add -f bindings/go/lib
          git commit -m "release: Go module $TAG with prebuilt native archives"
          git tag -a "$GO_TAG" -m "Go module $TAG"
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: would push $GO_TAG"; git show --stat HEAD | head -20; exit 0
          fi
          git push origin "refs/tags/$GO_TAG"
      - name: Upload C/C++ assets to the GitHub Release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" artifacts/c/*.tar.gz --clobber
      - name: Warm the Go module proxy
        if: env.DRY_RUN != 'true'
        run: |
          for _ in 1 2 3 4 5; do
            if curl -fsS "https://proxy.golang.org/$MODULE/@v/$TAG.info"; then exit 0; fi
            sleep 20
          done
          echo "proxy did not serve $MODULE@$TAG yet (it will on first request)"

  # ---------------------------------------------------------------------------
  # Prove the published module works for a consumer with no Rust toolchain.
  # ---------------------------------------------------------------------------
  verify:
    name: go get on ${{ matrix.os }}
    needs: [version, publish]
    if: github.event_name == 'release'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Consume the module
        env:
          VERSION: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir consumer && cd consumer
          go mod init example.com/consumer
          cat > main.go <<'EOF'
          package main

          import (
          	"fmt"

          	ferrota "github.com/pratikbhadane24/ferro-ta/bindings/go"
          )

          func main() {
          	out, err := ferrota.Sma([]float64{1, 2, 3, 4, 5}, 3)
          	if err != nil {
          		panic(err)
          	}
          	fmt.Println(ferrota.Version, out)
          }
          EOF
          for _ in 1 2 3 4 5 6; do
            if go get "$MODULE@$VERSION"; then break; fi
            sleep 30
          done
          go run .
