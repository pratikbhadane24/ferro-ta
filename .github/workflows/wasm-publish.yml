name: Publish WASM to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish WASM package to npm"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish to npm
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'release' && github.event.action == 'published')
      || (github.event_name == 'workflow_dispatch' && inputs.release)
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # npm trusted publishing (tokenless OIDC) needs npm >= 11.5.1. Node 20
          # ships npm 10, which publishes anonymously and gets `E404 PUT` back.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Require an npm CLI that supports trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install Rust and wasm-pack
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-pack

      - name: Run WASM tests
        working-directory: wasm
        run: wasm-pack test --node

      - name: Build WASM package
        run: |
          cd wasm
          npm run build

      - name: Publish to npm
        working-directory: wasm
        run: npm publish --access public --provenance
