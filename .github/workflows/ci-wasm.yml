name: CI WASM

on:
  workflow_call:

permissions:
  contents: read

jobs:
  wasm:
    name: WASM (test + build + bench)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""  # override target-cpu=native from .cargo/config.toml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      # `wasm/` carries its own [workspace] table, so it is NOT a member of the
      # root workspace: the `cargo clippy --workspace` in ci-rust.yml never sees
      # it. Lint it here, where the wasm32 target is already installed.
      # Scoped to the lib target (what wasm-pack actually ships) rather than
      # --all-targets: `mod tests` still has two pending manual_range_contains
      # findings. Once those are fixed, add --all-targets here.
      - name: Clippy WASM binding
        working-directory: wasm
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings
      # Advisory only, for now. The crate carries ~130 hunks of pre-existing
      # rustfmt drift; reformatting it in one shot would bury the reviewable
      # changes. Follow-up: land the one-shot `cargo fmt` for wasm/ on its own,
      # then drop `continue-on-error` to make this gating.
      - name: Rustfmt WASM binding (advisory)
        working-directory: wasm
        continue-on-error: true
        run: cargo fmt --check
      - name: Test WASM binding
        working-directory: wasm
        run: wasm-pack test --node
      - name: Build WASM packages (node + web)
        working-directory: wasm
        run: npm run build
      - name: Check API manifest is current
        run: python3 scripts/check_api_manifest.py
      - name: Benchmark WASM
        working-directory: wasm
        run: node bench.js --json ../wasm_benchmark.json
      - uses: actions/upload-artifact@v7
        with:
          name: wasm-pkg-node
          path: wasm/node/
      - uses: actions/upload-artifact@v7
        with:
          name: wasm-pkg-web
          path: wasm/web/
      - uses: actions/upload-artifact@v7
        with:
          name: wasm-benchmark
          path: wasm_benchmark.json
